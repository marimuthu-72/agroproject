<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History & Tracking | G. Saravana Agro Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar-agri">
    <div class="container d-flex justify-content-between align-items-center">
      <div><i class="fa-solid fa-truck-fast me-1 text-warning"></i> Real-Time Live Order Tracking Portal</div>
      <button id="lang-toggle" class="btn top-bar-btn btn-outline-light"><i class="fa-solid fa-language me-1"></i> தமிழ் / EN</button>
    </div>
  </div>

  <nav class="navbar navbar-agri sticky-top">
    <div class="container">
      <a class="navbar-brand-agri" href="index.html">
        <div class="brand-icon-wrapper"><img src="logo.png" alt="G. Saravana Agro Clinic Logo"></div>
        <div>
          <div class="brand-title">G. Saravana</div>
          <div class="brand-subtitle">Agro Clinic Order Tracking</div>
        </div>
      </a>
      <a href="index.html" class="btn btn-outline-gold rounded-pill px-3 py-2 fw-bold"><i class="fa-solid fa-house me-1"></i> Store Home</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="font-heading fw-bold text-emerald-800 mb-0"><i class="fa-solid fa-boxes-packing me-2 text-warning"></i>Your Orders & Farm Deliveries</h2>
      <a href="products.html" class="btn btn-gold rounded-pill px-3 py-2 font-heading fw-bold">+ New Order</a>
    </div>

    <div id="orders-history-list" class="d-flex flex-column gap-4">
      <!-- Populated via JS -->
    </div>
  </div>

  <footer class="footer-agri">
    <div class="container text-center text-slate-400 small">
      &copy; 2026 G. Saravana Agro Clinic. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
  <script>
    function renderOrderHistory() {
      if (!agriApp.requireAuth()) return;

      const container = document.getElementById('orders-history-list');
      if (!container) return;

      let orders = [];
      try {
        orders = JSON.parse(localStorage.getItem('agri_orders') || '[]');
      } catch(e) {
        orders = [];
      }

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="glass-card p-5 text-center">
            <i class="fa-solid fa-box-open display-1 text-muted mb-3"></i>
            <h4 class="font-heading fw-bold text-muted">No Orders Found</h4>
            <p class="text-muted small">You haven't placed any agricultural orders yet.</p>
            <a href="products.html" class="btn btn-gold rounded-pill px-4 py-2 font-heading fw-bold">Shop Fertilizers Now</a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const isPaid = o.paymentStatus === 'PAID' || (o.paymentMethod && !o.paymentMethod.includes('COD'));
        const items = Array.isArray(o.items) ? o.items : [];
        const status = o.orderStatus || 'Pending';

        return `
          <div class="glass-card p-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 pb-3 border-bottom gap-2">
              <div>
                <span class="badge badge-gold mb-1">${o.id}</span>
                <div class="small text-muted">Placed on ${o.date || 'Today'}</div>
              </div>
              <div class="text-end">
                <span class="badge ${isPaid ? 'bg-success' : 'bg-warning text-dark'} mb-1">${isPaid ? 'PAID ONLINE' : 'COD PENDING'}</span>
                <div class="fs-4 font-heading fw-bold text-emerald-800">₹${o.total}</div>
              </div>
            </div>

            <!-- Tracking Timeline -->
            <div class="mb-4">
              <label class="form-label fw-bold small text-muted text-uppercase mb-2"><i class="fa-solid fa-truck-fast me-1 text-warning"></i> Delivery Timeline</label>
              <div class="d-flex justify-content-between text-center position-relative">
                <div class="flex-fill">
                  <div class="p-2 rounded-circle bg-emerald-800 text-white d-inline-block"><i class="fa-solid fa-check"></i></div>
                  <div class="small fw-bold mt-1">Order Placed</div>
                </div>
                <div class="flex-fill">
                  <div class="p-2 rounded-circle ${status !== 'Pending' ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-muted'} d-inline-block"><i class="fa-solid fa-box"></i></div>
                  <div class="small fw-bold mt-1">Packed</div>
                </div>
                <div class="flex-fill">
                  <div class="p-2 rounded-circle ${status === 'Shipped' || status === 'Completed' || status === 'Delivered' ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-muted'} d-inline-block"><i class="fa-solid fa-tractor"></i></div>
                  <div class="small fw-bold mt-1">Dispatched</div>
                </div>
                <div class="flex-fill">
                  <div class="p-2 rounded-circle ${status === 'Completed' || status === 'Delivered' ? 'bg-emerald-800 text-white' : 'bg-slate-200 text-muted'} d-inline-block"><i class="fa-solid fa-house-chimney"></i></div>
                  <div class="small fw-bold mt-1">Delivered</div>
                </div>
              </div>
            </div>

            <!-- Items -->
            <div class="bg-slate-50 p-3 rounded-3 mb-3">
              <h6 class="font-heading fw-bold mb-2">Purchased Items</h6>
              ${items.map(item => `
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <span>${item.name} <strong class="text-muted">(x${item.quantity})</strong></span>
                  <span class="fw-bold">₹${item.price * item.quantity}</span>
                </div>
              `).join('')}
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <span class="small text-muted"><i class="fa-solid fa-location-dot me-1"></i> Delivery to: ${o.customerAddress || 'Cheranmahadevi'}</span>
              <button onclick="window.print()" class="btn btn-sm btn-outline-secondary rounded-pill fw-bold"><i class="fa-solid fa-print me-1"></i> Print Invoice</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderOrderHistory();
    });
  </script>
</body>
</html>
