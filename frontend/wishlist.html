<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Wishlist | G. Saravana Agro Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar-agri">
    <div class="container d-flex justify-content-between align-items-center">
      <div><i class="fa-solid fa-heart me-1 text-danger"></i> Saved Agricultural Wishlist</div>
      <button id="lang-toggle" class="btn top-bar-btn btn-outline-light"><i class="fa-solid fa-language me-1"></i> தமிழ் / EN</button>
    </div>
  </div>

  <nav class="navbar navbar-agri sticky-top">
    <div class="container">
      <a class="navbar-brand-agri" href="index.html">
        <div class="brand-icon-wrapper"><img src="logo.png" alt="G. Saravana Agro Clinic Logo"></div>
        <div>
          <div class="brand-title">G. Saravana</div>
          <div class="brand-subtitle">Agro Clinic Wishlist</div>
        </div>
      </a>
      <a href="products.html" class="btn btn-outline-gold rounded-pill px-3 py-2 fw-bold"><i class="fa-solid fa-arrow-left me-1"></i> Back to Catalog</a>
    </div>
  </nav>

  <div class="container py-5">
    <h2 class="font-heading fw-bold text-emerald-800 mb-4"><i class="fa-solid fa-heart me-2 text-danger"></i>Your Wishlist</h2>

    <div id="wishlist-grid" class="row g-4">
      <!-- Populated via JS -->
    </div>
  </div>

  <footer class="footer-agri">
    <div class="container text-center text-slate-400 small">
      &copy; 2026 G. Saravana Agro Clinic. All rights reserved.
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
  <script>
    function renderWishlist() {
      const container = document.getElementById('wishlist-grid');
      if (!container) return;

      const wishlistIds = agriApp.wishlist;
      const products = agriApp.getProducts().filter(p => wishlistIds.includes(p.id));

      if (products.length === 0) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="glass-card p-5">
              <i class="fa-regular fa-heart display-1 text-muted mb-3"></i>
              <h4 class="font-heading fw-bold text-muted">Your Wishlist is Empty</h4>
              <p class="text-muted small">Save items to your wishlist while browsing our catalog.</p>
              <a href="products.html" class="btn btn-gold rounded-pill px-4 py-2 font-heading fw-bold">Explore Catalog</a>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(p => `
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <div class="product-card">
            <div class="product-img-wrapper">
              <img src="${p.image}" alt="${p.name}" class="product-img">
              <button class="wishlist-btn active" onclick="agriApp.toggleWishlist('${p.id}'); renderWishlist();">
                <i class="fa-solid fa-heart"></i>
              </button>
            </div>
            <div class="product-info">
              <span class="product-category">${p.category}</span>
              <h6 class="product-title">${p.name}</h6>
              <div class="product-price-row">
                <span class="product-price">₹${p.price}</span>
                <button class="add-cart-btn" onclick="agriApp.addToCart('${p.id}')">
                  <i class="fa-solid fa-cart-plus me-1"></i> Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);
  </script>
</body>
</html>
