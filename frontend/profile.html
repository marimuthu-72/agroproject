<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Profile | G. Saravana Agro Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar-agri">
    <div class="container d-flex justify-content-between align-items-center">
      <div><i class="fa-solid fa-user-check me-1 text-warning"></i> Customer & Agronomy Profile Portal</div>
      <button id="lang-toggle" class="btn top-bar-btn btn-outline-light"><i class="fa-solid fa-language me-1"></i> தமிழ் / EN</button>
    </div>
  </div>

  <nav class="navbar navbar-agri sticky-top">
    <div class="container">
      <a class="navbar-brand-agri" href="index.html">
        <div class="brand-icon-wrapper"><img src="logo.png" alt="G. Saravana Agro Clinic Logo"></div>
        <div>
          <div class="brand-title">G. Saravana</div>
          <div class="brand-subtitle">Agro Clinic Profile</div>
        </div>
      </a>
      <a href="index.html" class="btn btn-outline-gold rounded-pill px-3 py-2 fw-bold"><i class="fa-solid fa-house me-1"></i> Store Home</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4">
      
      <!-- Profile Card Left -->
      <div class="col-lg-4">
        <div class="glass-card p-4 text-center">
          <div class="d-inline-flex p-4 rounded-circle bg-emerald-100 text-emerald-800 mb-3 shadow">
            <i class="fa-solid fa-user-large display-4"></i>
          </div>
          <h3 id="prof-name-display" class="font-heading fw-bold mb-1">---</h3>
          <span class="badge badge-gold px-3 py-2 rounded-pill mb-3">CERTIFIED FARMER MEMBER</span>
          
          <div class="p-3 bg-slate-50 rounded-3 text-start mb-4">
            <div class="small text-muted mb-1"><i class="fa-solid fa-phone me-2 text-warning"></i> Phone: <strong id="prof-phone">---</strong></div>
            <div class="small text-muted mb-1"><i class="fa-solid fa-envelope me-2 text-warning"></i> Email: <strong id="prof-email">---</strong></div>
            <div class="small text-muted"><i class="fa-solid fa-location-dot me-2 text-warning"></i> District: <strong id="prof-location">---</strong></div>
          </div>

          <button onclick="agriApp.logoutUser()" class="btn btn-outline-danger w-100 rounded-pill fw-bold">
            <i class="fa-solid fa-right-from-bracket me-1"></i> Log Out Account
          </button>
        </div>
      </div>

      <!-- Profile Forms Right -->
      <div class="col-lg-8">
        <div class="glass-card p-4">
          <h4 class="font-heading fw-bold text-emerald-800 mb-4 border-bottom pb-2"><i class="fa-solid fa-pen-to-square me-2 text-warning"></i>Edit Profile & Land Details</h4>

          <form onsubmit="saveProfileDetails(event)">
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Full Name / பெயர்</label>
                <input type="text" id="edit-name" class="form-control form-control-agri" placeholder="Enter Full Name">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Mobile Phone Number</label>
                <input type="tel" id="edit-phone" class="form-control form-control-agri phone-input" placeholder="10 Digit Mobile Number" inputmode="numeric" pattern="[0-9]*" maxlength="10" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Email Address</label>
                <input type="email" id="edit-email" class="form-control form-control-agri" placeholder="Enter Email Address">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted text-uppercase">Crop Land Size (Acres)</label>
                <input type="text" id="edit-land" class="form-control form-control-agri" placeholder="e.g. 5 Acres">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold small text-muted text-uppercase">Delivery Address</label>
                <textarea id="edit-address" class="form-control form-control-agri" rows="3" placeholder="Enter Street / Land Plot / Door No."></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-gold px-4 py-2 font-heading fw-bold">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
            </button>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/lang.js"></script>
  <script>
    function loadProfile() {
      if (!agriApp.requireAuth()) return;

      const u = agriApp.user;
      if (!u) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('prof-name-display').textContent = u.name || u.email || 'Farmer Account';
      document.getElementById('prof-phone').textContent = u.phone || 'Not provided';
      document.getElementById('prof-email').textContent = u.email || 'Not provided';
      document.getElementById('prof-location').textContent = u.district || u.city || 'Cheranmahadevi';

      document.getElementById('edit-name').value = u.name || '';
      document.getElementById('edit-phone').value = u.phone || '';
      document.getElementById('edit-email').value = u.email || '';
      document.getElementById('edit-land').value = u.land || '';
      document.getElementById('edit-address').value = u.address || '';
    }

    function saveProfileDetails(e) {
      e.preventDefault();
      if (!agriApp.requireAuth()) return;

      const name = document.getElementById('edit-name').value;
      const phone = document.getElementById('edit-phone').value;
      const email = document.getElementById('edit-email').value;
      const land = document.getElementById('edit-land').value;
      const address = document.getElementById('edit-address').value;

      const updatedUser = { ...(agriApp.user || {}), name, phone, email, land, address, role: 'farmer' };
      localStorage.setItem('agri_user', JSON.stringify(updatedUser));
      agriApp.user = updatedUser;
      agriApp.showToast('Profile updated successfully!', 'success');
      loadProfile();
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
