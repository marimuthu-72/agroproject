<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Admin Login | G. Saravana Agro Clinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body d-flex align-items-center justify-content-center min-vh-100 bg-slate-900">

  <div class="card p-4 p-md-5 border-0 shadow-lg rounded-4" style="max-width: 440px; width: 100%; background: #0f172a; color: #ffffff;">
    <div class="text-center mb-4">
      <div class="admin-brand-icon mx-auto mb-3" style="width: 64px; height: 64px;">
        <img src="../logo.png" alt="G. Saravana Agro Clinic Logo">
      </div>
      <h3 class="font-heading fw-bold text-white mb-1">ERP Admin Portal</h3>
      <p class="text-slate-400 small">G. Saravana Agro Clinic Enterprise Management</p>
    </div>

    <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3" role="alert"></div>

    <form onsubmit="handleAdminPortalLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-bold small text-slate-400 text-uppercase">Admin Username / ID *</label>
        <div class="input-group">
          <span class="input-group-text bg-slate-800 border-0 text-warning"><i class="fa-solid fa-user-shield"></i></span>
          <input type="text" id="admin-username" class="form-control bg-slate-800 border-0 text-white" required placeholder="Enter Admin Username" autocomplete="username">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small text-slate-400 text-uppercase">Admin Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-slate-800 border-0 text-warning"><i class="fa-solid fa-key"></i></span>
          <input type="password" id="admin-password" class="form-control bg-slate-800 border-0 text-white" required placeholder="Enter Secret Password" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-warning w-100 py-3 font-heading fw-bold text-dark rounded-pill">
        <i class="fa-solid fa-right-to-bracket me-2"></i> Access ERP System
      </button>
    </form>

    <div class="text-center mt-4">
      <a href="../login.html" class="text-slate-400 small"><i class="fa-solid fa-arrow-left me-1"></i> Return to Main Store</a>
    </div>
  </div>

  <script>
    async function handleAdminPortalLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('submit-btn');
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;

      alertBox.classList.add('d-none');

      if (!username || !password) {
        alertBox.textContent = 'Invalid admin credentials.';
        alertBox.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Authenticating...';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success && data.token) {
          localStorage.setItem('agri_admin_token', data.token);
          localStorage.setItem('agri_admin_authenticated', 'true');
          localStorage.setItem('agri_admin_user', data.username);
          window.location.href = 'dashboard.html';
        } else {
          alertBox.textContent = data.message || 'Invalid admin credentials.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Unable to connect to backend server. Please ensure the backend server is running.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i> Access ERP System';
      }
    }
  </script>
</body>
</html>
