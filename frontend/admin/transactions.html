<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revenue Transactions | ERP Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-wrapper">
    <div class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <div class="admin-brand-icon"><img src="../logo.png" alt="G. Saravana Agro Clinic Logo"></div>
        <div>
          <div class="fw-bold font-heading">Saravana ERP</div>
          <div class="small text-slate-400" style="font-size:0.7rem;">Cheranmahadevi</div>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="dashboard.html" class="admin-nav-item"><i class="fa-solid fa-chart-pie fs-5"></i> <span>Dashboard</span></a>
        <a href="products.html" class="admin-nav-item"><i class="fa-solid fa-boxes-stacked fs-5"></i> <span>Product Management</span></a>
        <a href="inventory.html" class="admin-nav-item"><i class="fa-solid fa-warehouse fs-5"></i> <span>Stock Inventory</span></a>
        <a href="orders.html" class="admin-nav-item"><i class="fa-solid fa-truck-ramp-box fs-5"></i> <span>Live Orders</span></a>
        <a href="inquiries.html" class="admin-nav-item"><i class="fa-solid fa-comments fs-5"></i> <span>User Messages</span></a>
        <a href="customers.html" class="admin-nav-item"><i class="fa-solid fa-users fs-5"></i> <span>Farmer Directory</span></a>
        <a href="offers.html" class="admin-nav-item"><i class="fa-solid fa-tags fs-5"></i> <span>Coupons & Offers</span></a>
        <a href="transactions.html" class="admin-nav-item active"><i class="fa-solid fa-receipt fs-5"></i> <span>Revenue & Payments</span></a>
        <a href="settings.html" class="admin-nav-item"><i class="fa-solid fa-user-lock fs-5"></i> <span>Account Security</span></a>
        
        <div class="mt-auto pt-3 border-top border-secondary">
          <a href="../index.html" class="admin-nav-item"><i class="fa-solid fa-store fs-5"></i> <span>View Main E-Store</span></a>
          <button onclick="adminLogout()" class="admin-nav-item border-0 bg-transparent text-danger w-100 text-start"><i class="fa-solid fa-right-from-bracket fs-5"></i> <span>Log Out</span></button>
        </div>
      </nav>
    </div>

    <div class="admin-main">
      <div class="admin-header">
        <h1 class="admin-page-title">Revenue & Payment Transaction Logs</h1>
        <button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.print()"><i class="fa-solid fa-print me-1"></i> Print Report</button>
      </div>

      <div class="admin-content">
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Txn Ref ID</th>
                <th>Order ID</th>
                <th>Payment Mode</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="txn-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    function renderTxn() {
      const body = document.getElementById('txn-table-body');
      if (!body) return;

      const orders = getStoredLiveOrders();
      body.innerHTML = orders.map(o => `
        <tr>
          <td class="fw-bold text-success">${o.txnId || 'TXN_AGRI_2026'}</td>
          <td>${o.id}</td>
          <td>${o.paymentMethod || 'Online UPI'}</td>
          <td class="fw-bold fs-6">₹${o.total}</td>
          <td><span class="status-pill success">${o.paymentStatus || 'PAID'}</span></td>
        </tr>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderTxn);
  </script>
</body>
</html>
